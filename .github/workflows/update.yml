name: Update news & gold, deploy to Pages

on:
  schedule:
    # News + live gold snapshot every 15 min (GitHub may delay scheduled runs a few minutes).
    - cron: '7,22,37,52 * * * *'
    # Once a day (18:41 IST) also commit the gold history so it is kept forever.
    - cron: '11 13 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch news + gold and build site
        run: node scripts/build.mjs

      - name: Commit daily gold history
        if: github.event.schedule == '11 13 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "gold: daily rates $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
