name: Update news & gold, deploy to Pages

# Minutes budget — private repo on GitHub Pro includes $18/month ≈ 3,000 Linux minutes
# (public repos: unlimited). Each run is ONE job; partial minutes round up per job.
# Default schedule (safe even if a run takes up to 2 min):
#   • every 30 min, 05:37–23:07 IST → 36 runs/day
#   • hourly overnight              →  6 runs/day   ≈ 43 runs/day ≈ 1,300–2,600 min/month
# Faster news: if a run finishes in under 60 s (see the Actions tab), change '7,37'
# below to '7,22,37,52' (every 15 min, ≈ 2,400 min/month). The Live button in the
# app always fetches the newest headlines instantly, whatever the schedule.
on:
  schedule:
    - cron: '7,37 0-17 * * *'       # daytime India (UTC 00–17 = IST 05:30–23:30)
    - cron: '7 18-23 * * *'         # overnight India, hourly
    - cron: '41 13 * * *'           # 19:11 IST – also commit the day's gold history
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest already ships Node 20+, so no setup-node step (saves time/minutes).
      - name: Fetch news + gold and build site
        run: node --version && node scripts/build.mjs

      - name: Commit daily gold history
        if: github.event.schedule == '41 13 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "gold: daily rates $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
