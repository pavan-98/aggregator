name: Update news & gold, deploy to Pages

# Schedule (times in IST): every 15 min from 05:37 to 23:22, hourly overnight,
# plus a daily 19:11 run that also commits the gold history (≈ 79 runs/day, ~20 s each).
# Public repos: GitHub Actions minutes are free and unlimited.
# Private repos: each run bills ≥1 min (~2,400 min/month at this schedule). On GitHub Free
# (2,000 min) or to save minutes, change '7,22,37,52' below to '7,37' (every 30 min).
# The app's Live button fetches the newest headlines instantly, whatever the schedule.
on:
  schedule:
    - cron: '7,22,37,52 0-17 * * *' # daytime India (UTC 00–17 = IST 05:30–23:30)
    - cron: '7 18-23 * * *'         # overnight India, hourly
    - cron: '41 13 * * *'           # 19:11 IST – also commit the day's gold history
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Gives the site's public address (incl. a custom domain) for link-preview tags.
      - id: pages
        uses: actions/configure-pages@v5

      # ubuntu-latest already ships Node 20+, so no setup-node step (saves time/minutes).
      - name: Fetch news + gold and build site
        run: node --version && node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      # Only the daily scheduled run commits, so manual runs and pushes don't add commits.
      # A missed day is filled in by the next run (Groww returns the last ~10 days).
      - name: Commit daily gold history
        if: github.event.schedule == '41 13 * * *'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-history.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "gold: daily rates $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # Unique per attempt: a re-run of the same run would otherwise leave two
          # "github-pages" artifacts and deploy-pages fails ("Multiple artifacts named ...").
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
